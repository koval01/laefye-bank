<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — Laefye</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #070708;
        --panel: #121214;
        --fog: #a1a1aa;
        --snow: #fafafa;
        --pink: #ff3d7f;
        --mint: #3dffb5;
        --line: #2a2a30;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100dvh; }
      body {
        font-family: Manrope, "Segoe UI", sans-serif;
        color: var(--snow);
        background-color: var(--void);
        background-image:
          radial-gradient(ellipse 90% 55% at 50% -20%, rgba(255, 61, 127, 0.22), transparent 55%),
          radial-gradient(ellipse 50% 40% at 100% 10%, rgba(61, 255, 181, 0.06), transparent 50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(28rem, 100%);
        text-align: center;
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes orbit {
        0%, 100% { transform: rotate(0deg) scale(1); }
        40% { transform: rotate(8deg) scale(1.04); }
        70% { transform: rotate(-4deg) scale(0.98); }
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        text-decoration: none;
        color: var(--snow);
        margin-bottom: 2.5rem;
      }
      .brand svg {
        width: 1.75rem;
        height: 1.75rem;
        transform-origin: 65% 50%;
        animation: orbit 4.5s ease-in-out infinite;
      }
      .brand span {
        font-family: Unbounded, sans-serif;
        font-weight: 600;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
      }
      .card {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem 1.75rem;
        backdrop-filter: blur(8px);
      }
      .code {
        font-family: Unbounded, sans-serif;
        font-size: clamp(3.5rem, 14vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(105deg, #ff3d7f 0%, #ff8fb3 55%, #fafafa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-family: Unbounded, sans-serif;
        font-size: 1.35rem;
        font-weight: 600;
        margin: 1rem 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--fog);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: center;
        margin-top: 1.75rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.15rem;
        border-radius: 0.85rem;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.btn:active { transform: scale(0.98); }
      a.primary {
        background: var(--pink);
        color: #fff;
      }
      a.primary:hover { background: #e11d5e; }
      a.ghost {
        background: transparent;
        color: var(--snow);
        border: 1px solid var(--line);
      }
      a.ghost:hover { border-color: color-mix(in srgb, var(--mint) 40%, var(--line)); }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: color-mix(in srgb, var(--fog) 80%, transparent);
      }
      @media (prefers-reduced-motion: reduce) {
        .wrap { animation: none; }
        .brand svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="brand" href="/" aria-label="Laefye — на главную">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <defs>
            <mask id="m">
              <rect width="28" height="28" fill="#fff" />
              <circle cx="18.2" cy="14.5" r="6.6" fill="#000" />
            </mask>
          </defs>
          <circle cx="11.2" cy="14.5" r="8.4" fill="#ff3d7f" mask="url(#m)" />
          <circle cx="18.2" cy="14.5" r="5.6" fill="#3dffb5" />
          <circle cx="18.2" cy="14.5" r="2" fill="#070708" />
        </svg>
        <span>laefye</span>
      </a>
      <div class="card">
        <div class="code" aria-hidden="true">404</div>
        <h1>Такой страницы нет</h1>
        <p>
          Ссылка устарела или адрес набран с ошибкой. Деньги и счета на месте — просто
          вернитесь в банк.
        </p>
        <div class="actions">
          <a class="btn primary" href="/">На главную</a>
          <a class="btn ghost" href="/auth">Войти</a>
        </div>
      </div>
      <p class="hint">Laefye Bank</p>
    </main>
  </body>
</html>
