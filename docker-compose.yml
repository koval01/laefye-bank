services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laefye
      POSTGRES_PASSWORD: laefye
      POSTGRES_DB: laefye_auth
    volumes:
      - laefye_auth_pg:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laefye -d laefye_auth"]
      interval: 3s
      timeout: 3s
      retries: 20

  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laefye
      POSTGRES_PASSWORD: laefye
      POSTGRES_DB: laefye_ledger
    volumes:
      - laefye_ledger_pg:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laefye -d laefye_ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - laefye_redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laefye
      MINIO_ROOT_PASSWORD: laefye-kyc-secret
    volumes:
      - laefye_minio:/data
    networks: [backend]
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Public customer edge (internet via cloudflared) ───────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_ADMIN: "0"
      additional_contexts:
        passkey_rs: ../passkey-rs
    expose:
      - "8080"
    environment:
      APP_ROLE: public
      AUTH_DATABASE_URL: postgres://laefye:laefye@auth-db:5432/laefye_auth
      LEDGER_DATABASE_URL: postgres://laefye:laefye@ledger-db:5432/laefye_ledger
      REDIS_URL: redis://redis:6379/
      HTTP_ADDR: 0.0.0.0:8080
      PASSKEY_HTTP_ONLY: "1"
      PASSKEY_SERVE_HTTP: "1"
      BLOCK_LOCALHOST: "1"
      ALLOW_DEBUG_RP: "1"
      PASSKEY_TRUST_FORWARDED: "1"
      RP_ID: pending.tunnel
      RP_NAME: Laefye Bank
      ORIGIN: https://pending.tunnel
      PASSKEY_ATTESTATION: compatible
      WELCOME_CREDIT_MINOR: "100000"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: laefye-kyc
      S3_ACCESS_KEY: laefye
      S3_SECRET_KEY: laefye-kyc-secret
      KYC_MASTER_KEY: y4gDrPDzM28ii3RpWDcOP6Wx/V92ZlFXVVwxKQcZNes=
      CBR_URL: https://www.cbr.ru/scripts/XML_daily.asp
      TRON_MODE: mock
      TRON_MASTER_SEED: b4530cb2fad77a02b66f13d86afee16c22b4d33112c3306a020ae62439d601a3
      TRONGRID_BASE: https://api.trongrid.io
      TRON_POLL_SECS: "20"
      RUST_LOG: info,passkey_rs=debug,laefye_bank=debug,tower_http=info,sqlx=warn
    networks: [backend, edge]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      auth-db:
        condition: service_healthy
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    expose:
      - "80"
    networks: [edge]
    depends_on:
      - api

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    expose:
      - "8080"
    networks: [edge]
    depends_on:
      - api
      - web

  cloudflared:
    build:
      context: ./docker/cloudflared
    environment:
      APP_URL: http://envoy:8080
      TUNNEL_TARGET: http://envoy:8080
      RP_ENDPOINT: http://envoy:8080/debug/rp
    networks: [edge]
    depends_on:
      - envoy
    restart: unless-stopped

  # ── Corporate admin (NOT on cloudflared / public edge) ─────
  # Access from host: http://127.0.0.1:9080
  # Inside corp net hostname: admin-gw (VIP 10.20.0.1 is optional; fixed IPs
  # break Docker Desktop on recreate — use alias instead).
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_ADMIN: "1"
      additional_contexts:
        passkey_rs: ../passkey-rs
    expose:
      - "8080"
    environment:
      APP_ROLE: admin
      SKIP_MIGRATE: "1"
      AUTH_DATABASE_URL: postgres://laefye:laefye@auth-db:5432/laefye_auth
      LEDGER_DATABASE_URL: postgres://laefye:laefye@ledger-db:5432/laefye_ledger
      REDIS_URL: redis://redis:6379/
      HTTP_ADDR: 0.0.0.0:8080
      PASSKEY_HTTP_ONLY: "1"
      PASSKEY_SERVE_HTTP: "1"
      BLOCK_LOCALHOST: "0"
      ALLOW_DEBUG_RP: "1"
      RP_ID: 127.0.0.1
      RP_NAME: Laefye Ops
      ORIGIN: http://127.0.0.1:9080
      PASSKEY_ATTESTATION: compatible
      ADMIN_HANDLES: "laefye_ops"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: laefye-kyc
      S3_ACCESS_KEY: laefye
      S3_SECRET_KEY: laefye-kyc-secret
      KYC_MASTER_KEY: y4gDrPDzM28ii3RpWDcOP6Wx/V92ZlFXVVwxKQcZNes=
      CBR_URL: https://www.cbr.ru/scripts/XML_daily.asp
      TRON_MODE: mock
      TRON_MASTER_SEED: b4530cb2fad77a02b66f13d86afee16c22b4d33112c3306a020ae62439d601a3
      RUST_LOG: info,passkey_rs=debug,laefye_bank=debug,tower_http=info,sqlx=warn
    networks: [backend, corp]
    depends_on:
      api:
        condition: service_healthy
      auth-db:
        condition: service_healthy
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: docker/admin-web/Dockerfile
    expose:
      - "80"
    networks: [corp]
    depends_on:
      - admin-api

  admin-gw:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/admin-gw/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      corp:
        aliases:
          - admin.corp
          # Symbolic “corp VIP” name — resolve via Docker DNS, not a fixed IP
          - ops.laefye.corp
    ports:
      # Loopback only — never published to LAN / tunnel
      - "127.0.0.1:9080:80"
    depends_on:
      - admin-api
      - admin-web

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  corp:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24

volumes:
  laefye_auth_pg:
  laefye_ledger_pg:
  laefye_redis:
  laefye_minio:
