server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Avoid default package error pages that advertise the web server.
    error_page 404 /404.html;
    error_page 400 401 403 405 410 500 502 503 504 /404.html;

    # Ops paths: branded 404, never the SPA shell.
    location ^~ /admin {
        return 404;
    }
    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    location = /404.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Static assets: long cache, no directory listing.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
