# Corporate admin gateway — intended address 10.20.0.1 (corp net).
# Not exposed via cloudflared. Local ops: http://127.0.0.1:9080

upstream admin_api {
    server admin-api:8080;
}

upstream admin_web {
    server admin-web:80;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Harden a bit — no public CDN headers needed
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Opaque error body — no default package branding.
    error_page 404 502 503 504 =404 @opaque_error;

    location @opaque_error {
        default_type text/plain;
        return 404 'not found\n';
    }

    location /api/ {
        proxy_pass http://admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
