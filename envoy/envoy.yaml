static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          generate_request_id: true
          use_remote_address: true
          skip_xff_append: false
          # Do not advertise Envoy (or upstream nginx) on the public edge.
          server_name: Laefye
          server_header_transformation: OVERWRITE
          common_http_protocol_options:
            idle_timeout: 3600s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            response_headers_to_remove:
              - "x-envoy-upstream-service-time"
              - "x-envoy-decorator-operation"
              - "x-envoy-overloaded"
            virtual_hosts:
            - name: laefye
              domains: ["*"]
              response_headers_to_add:
                - header:
                    key: "x-content-type-options"
                    value: "nosniff"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              # JSON 404 for ops API probes — no stack fingerprint.
              - match:
                  prefix: "/api/admin"
                direct_response:
                  status: 404
                  body:
                    inline_string: '{"error":"not found"}'
                response_headers_to_add:
                  - header:
                      key: "content-type"
                      value: "application/json; charset=utf-8"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - header:
                      key: "cache-control"
                      value: "no-store"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
              # Branded HTML 404 via customer SPA static (not Envoy plain text).
              - match:
                  prefix: "/admin"
                route:
                  cluster: web
                  timeout: 15s
              # Exact `/api` (secure channel) and `/api/...` — prefix `/api/`
              # alone misses POST /api and sends it to the SPA (405 HTML).
              - match:
                  prefix: "/api"
                route:
                  cluster: api
                  timeout: 60s
              - match:
                  prefix: "/debug/"
                route:
                  cluster: api
                  timeout: 60s
              - match:
                  prefix: "/"
                route:
                  cluster: web
                  timeout: 60s

  clusters:
  - name: api
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api
                port_value: 8080
  - name: web
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: web
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: web
                port_value: 80
